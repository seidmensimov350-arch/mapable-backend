<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapable – Accessible Vilnius!</title>.
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #555b66;
      --border: #d4d4d8;
      --accent: #1a56db;
      --yes: #15803d;
      --limited: #c26a00;
      --no: #b91c1c;
      --unknown: #6b7280;
      --parking: #1d4ed8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; color: var(--text); }
    #map { position: absolute; inset: 0; }

    .card { background: var(--bg); border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.18); }

    .topbar { position: absolute; z-index: 1100; top: 12px; left: 12px; max-width: 760px; width: calc(100% - 24px);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; }
    .brand { font-weight: 800; font-size: 22px; margin-right: 4px; }
    .brand span { color: var(--accent); }
    .topbar input[type="search"] { flex: 1 1 160px; }
    select, input, button { font: inherit; min-height: 42px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: #fff; color: var(--text); }
    button { cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    label.check { display: flex; align-items: center; gap: 6px; }
    label.check input { min-height: 0; width: 20px; height: 20px; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .info { position: absolute; z-index: 1050; left: 12px; bottom: 24px; max-width: 340px; padding: 12px 14px;
      font-size: 14px; line-height: 1.4; }
    .info strong.big { font-size: 24px; color: var(--no); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px;
      border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
    #status { color: var(--muted); margin-top: 6px; }

    .panel { position: absolute; z-index: 1200; top: 12px; right: 12px; bottom: 12px; width: 390px; overflow-y: auto; padding: 18px; }
    .panel[hidden] { display: none; }
    .panel h2 { margin: 0 40px 4px 0; font-size: 22px; }
    .close { position: absolute; top: 10px; right: 10px; width: 42px; padding: 0; font-size: 22px; line-height: 1; }
    .meta { color: var(--muted); margin: 0 0 12px; }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 999px; color: #fff; font-weight: 700; margin-bottom: 4px; }
    .section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .section h3 { font-size: 16px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .score { display: grid; grid-template-columns: 90px 1fr 36px; align-items: center; gap: 8px; margin: 6px 0; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); }
    .source { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
    .linklike { background: none; border: none; padding: 4px 0; min-height: 0; color: var(--accent);
      text-decoration: underline; text-align: left; }
    details { margin: 6px 0; }
    details ul { padding-left: 18px; margin: 6px 0; font-size: 14px; }

    .pk-icon { background: var(--parking); color: #fff; font-weight: 800; font-size: 14px; border-radius: 6px;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }

    .toast { position: absolute; z-index: 1300; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #111; color: #fff; padding: 10px 16px; border-radius: 8px; }
    .toast[hidden] { display: none; }

    @media (max-width: 700px) {
      .brand { font-size: 18px; width: 100%; }
      .topbar select, .topbar button { flex: 1 1 45%; }
      .info { display: none; }
      .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 65vh; border-radius: 16px 16px 0 0; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map of Vilnius"></div>

  <header class="topbar card">
    <div class="brand">Map<span>able</span></div>
    <label class="sr-only" for="search">Search places</label>
    <input id="search" type="search" placeholder="Search a place…">
    <label class="sr-only" for="need">Accessible for</label>
    <select id="need">
      <option value="">All places</option>
      <option value="mobility">♿ Wheelchair accessible</option>
      <option value="vision">Blind / low vision</option>
      <option value="hearing">Deaf / hard of hearing</option>
      <option value="cognitive">Cognitive needs</option>
    </select>
    <label class="sr-only" for="category">Category</label>
    <select id="category"><option value="">All categories</option></select>
    <label class="check"><input id="parking" type="checkbox" checked> Parking</label>
    <button id="locate" type="button">📍 Near me</button>
  </header>

  <aside class="info card">
    <div id="stats">Loading statistics…</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--yes)"></span>Accessible</span>
      <span><span class="dot" style="background:var(--limited)"></span>Partly</span>
      <span><span class="dot" style="background:var(--no)"></span>Not accessible</span>
      <span><span class="dot" style="background:var(--unknown)"></span>Unknown</span>
      <span><span class="dot" style="background:var(--parking);border-radius:3px"></span>Disabled parking</span>
    </div>
    <div id="status" aria-live="polite"></div>
  </aside>

  <aside id="panel" class="panel card" hidden aria-live="polite">
    <button class="close" type="button" id="close" aria-label="Close details">×</button>
    <div id="panelBody"></div>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = "/api";
    const COLORS = { yes: "#15803d", limited: "#c26a00", no: "#b91c1c", unknown: "#6b7280" };
    const LABELS = {
      yes: "♿ Wheelchair accessible",
      limited: "Partly accessible",
      no: "Not wheelchair accessible",
      unknown: "No accessibility info yet",
    };
    const DISABILITY_LABELS = { mobility: "Mobility", vision: "Vision", hearing: "Hearing", cognitive: "Cognitive" };

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "");
    const pretty = (s) => { const t = String(s || "").replace(/_/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };

    let visitorId;
    try {
      visitorId = localStorage.getItem("mapable_visitor");
      if (!visitorId) {
        visitorId = "v-" + Math.random().toString(36).slice(2, 12);
        localStorage.setItem("mapable_visitor", visitorId);
      }
    } catch (e) {
      visitorId = "v-" + Math.random().toString(36).slice(2, 12);
    }

    async function getJSON(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
      return data;
    }

    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (t.hidden = true), 3000);
    }

    function statusOf(p) {
      const w = p.accessibility.wheelchair;
      const m = p.official_scores ? p.official_scores.mobility : null;
      if (w === "yes" || p.has_restaurant_evidence || (m != null && m >= 50)) return "yes";
      if (w === "limited" || (m != null && m > 0)) return "limited";
      if (w === "no" || m === 0) return "no";
      return "unknown";
    }

    // ---------- Map ----------
    const map = L.map("map", { zoomControl: false }).setView([54.6872, 25.2797], 15);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const placesLayer = L.layerGroup().addTo(map);
    const parkingLayer = L.layerGroup();
    const parkingMarkers = new Map();
    let selected = null;

    // ---------- Places ----------
    let loadTimer;
    let requestId = 0;

    function placeQuery() {
      const params = new URLSearchParams();
      const q = $("search").value.trim();
      if (q) {
        params.set("q", q);
        params.set("limit", "100");
      } else {
        const b = map.getBounds();
        params.set("bbox", [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => n.toFixed(6)).join(","));
        params.set("limit", "500");
      }
      if ($("need").value) params.set("disability", $("need").value);
      if ($("category").value) params.set("category", $("category").value);
      return params.toString();
    }

    async function loadPlaces(options = {}) {
      const id = ++requestId;
      $("status").textContent = "Loading places…";
      try {
        const data = await getJSON(`${API}/places?${placeQuery()}`);
        if (id !== requestId) return;
        placesLayer.clearLayers();
        for (const p of data.places) {
          const st = statusOf(p);
          L.circleMarker([p.latitude, p.longitude], {
            radius: 8, color: "#fff", weight: 2, fillColor: COLORS[st], fillOpacity: 0.95,
          })
            .bindTooltip(`${esc(p.name)} — ${LABELS[st]}`)
            .on("click", () => openPlace(p.id))
            .addTo(placesLayer);
        }
        if (options.fit && data.places.length) {
          map.fitBounds(L.latLngBounds(data.places.map((p) => [p.latitude, p.longitude])), { maxZoom: 17, padding: [60, 60] });
        }
        $("status").textContent = data.count >= 500
          ? "Showing 500 places — zoom in to see all"
          : `${data.count} places shown`;
      } catch (err) {
        if (id === requestId) $("status").textContent = "Could not load places: " + err.message;
      }
    }

    function scheduleLoad() {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => loadPlaces(), 300);
    }

    map.on("moveend", scheduleLoad);
    $("need").addEventListener("change", () => loadPlaces());
    $("category").addEventListener("change", () => loadPlaces());
    $("search").addEventListener("input", () => {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => loadPlaces({ fit: true }), 400);
    });

    // ---------- Place details ----------
    async function openPlace(id) {
      $("panel").hidden = false;
      $("panelBody").innerHTML = "<p>Loading…</p>";
      try {
        const p = await getJSON(`${API}/places/${id}`);
        renderPlace(p);
      } catch (err) {
        $("panelBody").innerHTML = `<p>Could not load this place: ${esc(err.message)}</p>`;
      }
    }

    function row(label, value) {
      return `<div class="row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
    }

    function scoreBar(label, value) {
      if (value == null) return "";
      const pct = Math.max(0, Math.min(100, Number(value)));
      return `<div class="score"><span>${esc(label)}</span>
        <div class="bar" role="img" aria-label="${esc(label)} ${Math.round(pct)} out of 100"><div style="width:${pct}%"></div></div>
        <b>${Math.round(pct)}</b></div>`;
    }

    function question(placeId, feature, text, options, votes) {
      const counts = votes[feature] || {};
      const summary = options.map(([val, label]) => `${label}: ${counts[val] || 0}`).join(" · ");
      return `<p style="margin:10px 0 4px"><b>${esc(text)}</b></p>
        <div class="btns">${options.map(([val, label]) =>
          `<button type="button" data-place="${placeId}" data-feature="${feature}" data-value="${val}">${label}</button>`).join("")}</div>
        <p class="source">${summary}</p>`;
    }

    function renderPlace(p) {
      const st = statusOf(p);
      const a = p.accessibility;
      const parts = [];

      parts.push(`<h2>${esc(p.name)}</h2>`);
      parts.push(`<p class="meta">${esc(pretty(p.category))}${p.address ? " · " + esc(p.address) : ""}</p>`);
      parts.push(`<span class="badge" style="background:${COLORS[st]}">${LABELS[st]}</span>`);

      const facts = [];
      if (a.wheelchair !== "unknown") facts.push(row("Wheelchair access (OpenStreetMap)", pretty(a.wheelchair)));
      if (a.toilets_wheelchair !== "unknown") facts.push(row("Accessible toilet (OpenStreetMap)", pretty(a.toilets_wheelchair)));
      for (const e of p.restaurant_evidence || []) {
        const url = safeUrl(e.source_url);
        facts.push(`<div class="row"><span>${esc(e.accessibility_claim)} (${esc(e.source_name)})</span>${url ? `<a href="${url}" target="_blank" rel="noopener">Source</a>` : ""}</div>`);
      }
      parts.push(`<div class="section"><h3>What the data says</h3>${facts.length ? facts.join("")
        : "<p class='source'>No accessibility data from any source yet. You can help below.</p>"}</div>`);

      if (p.official_scores) {
        const s = p.official_scores;
        let html = `<div class="section"><h3>Official accessibility assessment</h3>`;
        for (const k of ["mobility", "vision", "hearing", "cognitive"]) html += scoreBar(DISABILITY_LABELS[k], s[k]);
        for (const [type, items] of Object.entries(p.official_assessments || {})) {
          html += `<details><summary>${esc(type)} — ${items.length} criteria</summary><ul>${items.map((i) =>
            `<li>${esc(i.criterion)}: <b>${i.score == null ? "–" : esc(i.score)}</b></li>`).join("")}</ul></details>`;
        }
        html += `<p class="source">Source: Lithuanian Open Data Portal (data.gov.lt)</p></div>`;
        parts.push(html);
      }

      const pk = p.nearby_parking || [];
      parts.push(`<div class="section"><h3>Accessible parking within 500 m</h3>${pk.length
        ? pk.map((x) => `<button class="linklike" type="button" data-parking="${x.id}">🅿 ${esc(x.address || "Parking")} — ${x.number_of_places || "?"} space(s), ${x.distance_m} m</button>`).join("<br>")
        : "<p class='source'>None found within 500 m.</p>"}<p class="source">Source: JUDU (Vilnius)</p></div>`);

      const v = p.verifications || {};
      parts.push(`<div class="section"><h3>Been here? Help others</h3>
        ${question(p.id, "stair_free_entrance", "Is the entrance step-free?", [["yes", "Yes"], ["no", "No"]], v)}
        ${question(p.id, "noise_level", "How noisy is it?", [["quiet", "Quiet"], ["moderate", "Moderate"], ["loud", "Loud"]], v)}
      </div>`);

      $("panelBody").innerHTML = parts.join("");

      if (selected) map.removeLayer(selected);
      selected = L.circleMarker([p.latitude, p.longitude], {
        radius: 15, color: "#1a56db", weight: 4, fill: false, interactive: false,
      }).addTo(map);
    }

    $("panelBody").addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      if (btn.dataset.parking) {
        showParking(Number(btn.dataset.parking));
        return;
      }

      if (btn.dataset.feature) {
        btn.disabled = true;
        try {
          await getJSON(`${API}/places/${btn.dataset.place}/verifications`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              visitor_id: visitorId,
              accessibility_feature: btn.dataset.feature,
              reported_value: btn.dataset.value,
            }),
          });
          toast("Thanks! Your answer was saved.");
          openPlace(Number(btn.dataset.place));
        } catch (err) {
          toast("Could not save: " + err.message);
          btn.disabled = false;
        }
      }
    });

    $("close").addEventListener("click", () => {
      $("panel").hidden = true;
      if (selected) { map.removeLayer(selected); selected = null; }
    });

    // ---------- Parking ----------
    const parkingIcon = L.divIcon({ className: "pk-icon", html: "P", iconSize: [24, 24] });
    let parkingLoaded = false;

    async function loadParking() {
      if (parkingLoaded) return;
      const data = await getJSON(`${API}/parking`);
      for (const pk of data.parking) {
        const m = L.marker([pk.latitude, pk.longitude], { icon: parkingIcon, title: "Accessible parking " + (pk.address || "") })
          .bindPopup(`<b>Accessible parking</b><br>${esc(pk.address || "")}<br>${pk.number_of_places || "?"} space(s)` +
            `${pk.parking_space_dimensions ? " · " + esc(pk.parking_space_dimensions) : ""}` +
            `${pk.positioning_mode ? "<br>" + esc(pk.positioning_mode) : ""}<br><span class="source">Source: JUDU</span>`);
        m.addTo(parkingLayer);
        parkingMarkers.set(pk.id, m);
      }
      parkingLoaded = true;
    }

    async function setParking(on) {
      if (on) {
        try {
          await loadParking();
          map.addLayer(parkingLayer);
        } catch (err) {
          toast("Could not load parking");
        }
      } else {
        map.removeLayer(parkingLayer);
      }
    }

    async function showParking(id) {
      $("parking").checked = true;
      await setParking(true);
      const m = parkingMarkers.get(id);
      if (m) {
        map.setView(m.getLatLng(), 18);
        m.openPopup();
      }
    }

    $("parking").addEventListener("change", (e) => setParking(e.target.checked));

    // ---------- Categories, stats, location ----------
    async function loadCategories() {
      try {
        const cats = await getJSON(`${API}/categories`);
        for (const c of cats.slice(0, 30)) {
          const o = document.createElement("option");
          o.value = c.category;
          o.textContent = `${pretty(c.category)} (${c.count})`;
          $("category").appendChild(o);
        }
      } catch (e) { /* the filter still works without categories */ }
    }

    async function loadStats() {
      try {
        const s = await getJSON(`${API}/stats`);
        const total = s.osm_wheelchair.reduce((sum, r) => sum + r.count, 0);
        const unknown = (s.osm_wheelchair.find((r) => r.wheelchair_value === "unknown") || { count: 0 }).count;
        const pct = total ? Math.round((unknown / total) * 100) : 0;
        $("stats").innerHTML = `<strong class="big">${pct}%</strong> of ${total.toLocaleString()} mapped places in Vilnius have
          <b>no wheelchair information</b>. Visited one? Tap it and help fill the gap.
          <p class="source">${s.parking_locations} accessible parking locations · ${s.parking_spaces} spaces (JUDU)</p>`;
      } catch (e) {
        $("stats").textContent = "";
      }
    }

    $("locate").addEventListener("click", () => {
      if (!navigator.geolocation) return toast("Location is not available");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const ll = [pos.coords.latitude, pos.coords.longitude];
          map.setView(ll, 17);
          L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1a56db", fillOpacity: 1 })
            .addTo(map).bindTooltip("You are here");
        },
        () => toast("Could not get your location")
      );
    });

    loadCategories();
    loadStats();
    setParking(true);
    loadPlaces();
  </script>
</body>
</html>
